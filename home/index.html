<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calc99</title>
  <link rel="stylesheet" href="/home/assets/css/style.css">
  <link rel="stylesheet" href="/home/assets/css/os.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2308080c'/%3E%3Ctext x='50' y='68' font-family='monospace' font-size='48' fill='%236ee7ff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
</head>
<body>

  <!-- Boot screen -->
  <div id="boot-screen">
    <div class="boot-logo">CALC99</div>
    <div class="boot-spinner"></div>
    <div class="boot-status">Booting…</div>
  </div>

  <!-- Top bar -->
  <header id="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">CALC99</span>
      <span class="topbar-sep">·</span>
      <span id="topbar-app" class="topbar-app"></span>
    </div>
    <div class="topbar-right">
      <span class="topbar-status" title="Local files only">●</span>
      <span id="topbar-clock" class="topbar-clock">--:--</span>
      <button id="topbar-panic" class="topbar-panic" title="Back to calculator (Ctrl+\)">PANIC</button>
    </div>
  </header>

  <!-- Desktop -->
  <main id="desktop">
    <!-- Windows get inserted here by os.js -->

    <!-- Desktop icons (top-left corner) -->
    <div class="desktop-icons">
      <button class="desktop-icon" data-app="games">
        <span class="di-icon">🎮</span>
        <span class="di-label">Games</span>
      </button>
      <button class="desktop-icon" data-app="browser">
        <span class="di-icon">🛰</span>
        <span class="di-label">Browser</span>
      </button>
      <button class="desktop-icon" data-app="ai">
        <span class="di-icon">🤖</span>
        <span class="di-label">AI Chat</span>
      </button>
      <button class="desktop-icon" data-app="about">
        <span class="di-icon">ℹ</span>
        <span class="di-label">About</span>
      </button>
    </div>

    <!-- Hint -->
    <div class="desktop-hint">
      Double-click desktop for <b>About</b> · Drag title bars to move · <kbd>Ctrl+\</kbd> to panic
    </div>
  </main>

  <!-- Dock -->
  <nav id="dock">
    <button class="dock-icon" data-app="games"    title="Games">🎮</button>
    <button class="dock-icon" data-app="browser" title="Browser (proxy)">🛰</button>
    <button class="dock-icon" data-app="ai"      title="AI Chat">🤖</button>
    <span class="dock-sep"></span>
    <button class="dock-icon" data-app="about"   title="About">ℹ</button>
  </nav>

  <script src="/home/assets/js/os.js"></script>
</body>
</html>
