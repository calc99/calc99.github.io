<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Baldi's Web-Based Basics</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var unityInstance = UnityLoader.instantiate("unityContainer", "Build/baldi.json", { onProgress: UnityProgress });
    </script>
    <style>
      html, body {
        margin: 0; padding: 0; background: #000; overflow: hidden;
        width: 100%; height: 100%;
      }
      .webgl-content { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
      #unityContainer { width: 960px; height: 600px; }
      @media (max-width: 960px) {
        #unityContainer { width: 100vw; height: 100vh; }
      }
      .webgl-content .footer { display: none; }
    </style>
  </head>
  <body>
    <div class="webgl-content">
      <div id="unityContainer"></div>
    </div>
  </body>
</html>
