<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calc99 — Games</title>
  <link rel="stylesheet" href="/home/assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a14'/%3E%3Ctext x='50' y='68' font-family='monospace' font-size='48' fill='%2300f0ff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="nav-root"></div>

  <main class="container">
    <h1 class="section-title">Games</h1>
    <p class="section-sub">Click any game to launch it full-screen. If a game is broken, it likely got pulled from its CDN — file an issue on GitHub.</p>

    <div class="search-box">
      <input id="search" type="search" placeholder="Search by name or tag…" autocomplete="off">
    </div>

    <div id="grid" class="grid grid-4">
      <div class="game-card"><div class="game-thumb">…</div></div>
      <p style="color:var(--text-dim)">Loading games…</p>
    </div>

    <footer class="footer">
      Calc99 · <a href="https://github.com/calc99/calc99.github.io" target="_blank" rel="noopener">github.com/calc99/calc99.github.io</a>
    </footer>
  </main>

  <script src="/home/assets/js/main.js"></script>
  <script>Calc99.renderNav('games');</script>
  <script>
  (async function () {
    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    let games = [];

    function render(list) {
      if (!list.length) {
        grid.innerHTML = '<p style="color:var(--text-dim)">No games match that search.</p>';
        return;
      }
      grid.innerHTML = list.map(g => `
        <a class="game-card" href="/home/games/play.html?id=${encodeURIComponent(g.id)}">
          <div class="game-thumb">${escapeHtml(g.name.slice(0,4).toUpperCase())}</div>
          <div class="game-body">
            <div class="game-name">${escapeHtml(g.name)}</div>
            <div class="game-tag">${escapeHtml(g.tag || 'Game')}</div>
          </div>
        </a>
      `).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      if (!q) return render(games);
      render(games.filter(g =>
        g.name.toLowerCase().includes(q) ||
        (g.tag || '').toLowerCase().includes(q)
      ));
    });

    try {
      const res = await fetch('/home/games/games.json', { cache: 'no-store' });
      games = await res.json();
      render(games);
    } catch (e) {
      grid.innerHTML = '<p style="color:var(--danger)">Failed to load games.json. Check the file exists.</p>';
      console.error(e);
    }
  })();
  </script>
</body>
</html>
