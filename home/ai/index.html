<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calc99 — AI</title>
  <link rel="stylesheet" href="/home/assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a14'/%3E%3Ctext x='50' y='68' font-family='monospace' font-size='48' fill='%2300f0ff' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="nav-root"></div>

  <main class="container" style="padding-top:18px; padding-bottom:18px;">

    <div class="player-bar" style="margin-bottom:14px;">
      <h1 class="section-title" style="margin:0; font-size:1.3rem;">AI Chat</h1>
      <button id="clear-btn" class="btn btn-ghost" style="margin-left:auto;">Clear chat</button>
    </div>

    <p id="chat-meta" class="chat-meta connecting">
      <span class="status-dot"></span>
      <span id="chat-status">Checking connection…</span>
    </p>

    <div class="chat-wrap">
      <div id="chat-log" class="chat-log">
        <!-- messages injected by JS -->
      </div>

      <div class="chat-input">
        <textarea id="msg-input" placeholder="Type a message…  (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
        <button id="send-btn" class="btn btn-primary">Send</button>
      </div>
    </div>
  </main>

  <script src="/home/assets/js/main.js"></script>
  <script>Calc99.renderNav('ai');</script>
  <script src="/home/ai/chat.js"></script>
</body>
</html>
