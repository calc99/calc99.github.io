<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calc99 - Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #e5e7eb; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calc-wrapper {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1), 0 4px 10px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .display-area {
            background-color: #ffffff;
            padding: 24px 32px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            border-bottom: 1px solid #e5e7eb;
            position: relative;
        }

        .history-text {
            color: #6b7280;
            font-size: 1.25rem;
            min-height: 1.75rem;
            margin-bottom: 8px;
            word-wrap: break-word;
            max-width: 100%;
        }

        .main-text {
            color: #111827;
            font-size: 3rem;
            font-weight: 400;
            line-height: 1;
            word-wrap: break-word;
            max-width: 100%;
            letter-spacing: -0.02em;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 3rem;
            background-color: #2563eb;
            vertical-align: middle;
            animation: blink 1s step-start infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .keypad-container {
            display: flex;
            background-color: #f9fafb;
            padding: 16px;
            gap: 16px;
        }

        /* Mobile responsive stack */
        @media (max-width: 640px) {
            .keypad-container {
                flex-direction: column;
            }
            .calc-wrapper {
                height: 100vh;
                border-radius: 0;
            }
            .display-area {
                flex: 1;
            }
        }

        .grid-panel {
            display: grid;
            gap: 8px;
            flex: 1;
        }

        .left-panel {
            grid-template-columns: repeat(3, 1fr);
        }

        .right-panel {
            grid-template-columns: repeat(4, 1fr);
        }

        .btn {
            background-color: #f3f4f6;
            border: none;
            border-radius: 8px;
            padding: 16px 0;
            font-size: 1.1rem;
            font-weight: 500;
            color: #374151;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:hover { background-color: #e5e7eb; }
        .btn:active { background-color: #d1d5db; transform: scale(0.97); }

        /* Specific Button Types */
        .btn-num {
            background-color: #ffffff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            font-size: 1.25rem;
            font-weight: 600;
        }
        .btn-num:hover { background-color: #f9fafb; }
        .btn-num:active { background-color: #f3f4f6; }

        .btn-op { color: #111827; }
        
        .btn-eval {
            background-color: #2563eb;
            color: white;
            font-weight: 600;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }
        .btn-eval:hover { background-color: #1d4ed8; }
        .btn-eval:active { background-color: #1e40af; }

        .btn-2nd.active {
            background-color: #374151;
            color: white;
        }

        /* Secret Mode Indicators */
        .secret-indicator {
            position: absolute;
            top: 16px;
            left: 20px;
            color: #ef4444;
            font-weight: 600;
            font-size: 0.875rem;
            letter-spacing: 0.05em;
            display: none;
        }
        .secret-mode .secret-indicator { display: block; }
        .secret-mode .cursor { background-color: #ef4444; }

    </style>
</head>
<body>

    <div class="calc-wrapper" id="calcWrapper">
        
        <div class="display-area">
            <div class="secret-indicator">SEC MODE</div>
            <div class="history-text" id="history"></div>
            <div class="flex items-center">
                <div class="main-text" id="display"></div>
                <div class="cursor" id="cursor"></div>
            </div>
        </div>

        <div class="keypad-container">
            <!-- Left Panel: Functions -->
            <div class="grid-panel left-panel">
                <button class="btn btn-2nd" id="btn2nd" onclick="toggle2nd()">2nd</button>
                <button class="btn" onclick="handleInput('π')">π</button>
                <button class="btn" onclick="handleInput('e')">e</button>
                
                <button class="btn" onclick="handleInput('²')">a²</button>
                <button class="btn" onclick="handleInput('^')">a^b</button>
                <button class="btn" onclick="handleInput('√(')">√</button>

                <button class="btn" onclick="handleInput('sin(')">sin</button>
                <button class="btn" onclick="handleInput('cos(')">cos</button>
                <button class="btn" onclick="handleInput('tan(')">tan</button>

                <button class="btn" onclick="handleInput('(')">(</button>
                <button class="btn" onclick="handleInput(')')">)</button>
                <button class="btn" onclick="handleInput('ANS')">ans</button>
            </div>

            <!-- Right Panel: Numpad and Basics -->
            <div class="grid-panel right-panel">
                <button class="btn" onclick="handleClear()">AC</button>
                <button class="btn" onclick="handleDel()">DEL</button>
                <button class="btn btn-op" onclick="handleInput('%')">%</button>
                <button class="btn btn-op" onclick="handleInput('÷')">÷</button>

                <button class="btn btn-num" onclick="handleInput('7')">7</button>
                <button class="btn btn-num" onclick="handleInput('8')">8</button>
                <button class="btn btn-num" onclick="handleInput('9')">9</button>
                <button class="btn btn-op" onclick="handleInput('×')">×</button>

                <button class="btn btn-num" onclick="handleInput('4')">4</button>
                <button class="btn btn-num" onclick="handleInput('5')">5</button>
                <button class="btn btn-num" onclick="handleInput('6')">6</button>
                <button class="btn btn-op" onclick="handleInput('-')">-</button>

                <button class="btn btn-num" onclick="handleInput('1')">1</button>
                <button class="btn btn-num" onclick="handleInput('2')">2</button>
                <button class="btn btn-num" onclick="handleInput('3')">3</button>
                <button class="btn btn-op" onclick="handleInput('+')">+</button>

                <button class="btn btn-num" onclick="handleInput('0')">0</button>
                <button class="btn btn-num" onclick="handleInput('.')">.</button>
                <button class="btn btn-num" onclick="handleInput('-')">(-)</button>
                <button class="btn btn-eval" onclick="handleEnter()">=</button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const displayEl = document.getElementById('display');
        const historyEl = document.getElementById('history');
        const wrapperEl = document.getElementById('calcWrapper');
        const btn2nd = document.getElementById('btn2nd');
        const cursor = document.getElementById('cursor');

        // State Variables
        let expression = '';
        let lastAnswer = '0';
        let justEvaluated = false;
        
        // Secret Mode Variables
        let is2ndActive = false;
        let isSecretModeActive = false;
        let secretBuffer = '';
        const TARGET_SECRET = '0000';
        const REDIRECT_URL = 'https://calc99.github.io/home/index.html';

        function updateDisplay() {
            if (isSecretModeActive) {
                historyEl.textContent = 'Enter Secret Code:';
                displayEl.textContent = secretBuffer || '';
                return;
            }

            // Standard display logic
            if (justEvaluated) {
                historyEl.textContent = expression + ' =';
                displayEl.textContent = lastAnswer;
                cursor.style.display = 'none'; // Hide cursor when showing answer
            } else {
                historyEl.textContent = 'Ans = ' + lastAnswer;
                displayEl.textContent = expression;
                cursor.style.display = 'inline-block';
            }
        }

        function handleInput(val) {
            // Secret Mode Input Logic
            if (isSecretModeActive) {
                if (val >= '0' && val <= '9' && secretBuffer.length < TARGET_SECRET.length) {
                    secretBuffer += val;
                    updateDisplay();
                    
                    if (secretBuffer === TARGET_SECRET) {
                        displayEl.textContent = 'Authorizing...';
                        setTimeout(() => {
                            window.location.href = REDIRECT_URL;
                        }, 500);
                    } else if (secretBuffer.length === TARGET_SECRET.length) {
                        displayEl.textContent = 'Error';
                        setTimeout(() => {
                            secretBuffer = '';
                            updateDisplay();
                        }, 800);
                    }
                }
                return;
            }

            // Normal Calculator Logic
            reset2nd(); // any regular input cancels 2nd state

            if (justEvaluated) {
                // If user types operator after evaluating, chain the answer
                if (['+', '-', '×', '÷', '^', '²'].includes(val)) {
                    expression = 'ANS' + val;
                } else {
                    expression = val;
                }
                justEvaluated = false;
            } else {
                expression += val;
            }
            
            updateDisplay();
        }

        function toggle2nd() {
            if (isSecretModeActive) return;
            is2ndActive = !is2ndActive;
            if (is2ndActive) {
                btn2nd.classList.add('active');
            } else {
                btn2nd.classList.remove('active');
            }
        }

        function reset2nd() {
            is2ndActive = false;
            btn2nd.classList.remove('active');
        }

        function handleClear() {
            if (isSecretModeActive) {
                // Exit secret mode
                isSecretModeActive = false;
                secretBuffer = '';
                wrapperEl.classList.remove('secret-mode');
            }
            reset2nd();
            expression = '';
            justEvaluated = false;
            updateDisplay();
        }

        function handleDel() {
            if (isSecretModeActive) return;
            reset2nd();
            
            if (justEvaluated) {
                expression = '';
                justEvaluated = false;
            } else if (expression.length > 0) {
                // Remove function blocks intelligently
                if (expression.endsWith('sin(') || expression.endsWith('cos(') || expression.endsWith('tan(')) {
                    expression = expression.slice(0, -4);
                } else if (expression.endsWith('√(')) {
                    expression = expression.slice(0, -2);
                } else {
                    expression = expression.slice(0, -1);
                }
            }
            updateDisplay();
        }

        function handleEnter() {
            // TRIGGER SECRET MODE
            if (is2ndActive && !isSecretModeActive) {
                isSecretModeActive = true;
                reset2nd();
                secretBuffer = '';
                wrapperEl.classList.add('secret-mode');
                updateDisplay();
                return;
            }

            if (isSecretModeActive || expression.trim() === '') return;
            reset2nd();

            try {
                // Format string for JS Math evaluation
                let parseable = expression
                    .replace(/ANS/g, `(${lastAnswer})`)
                    .replace(/π/g, 'Math.PI')
                    .replace(/e/g, 'Math.E')
                    .replace(/sin\(/g, 'Math.sin(')
                    .replace(/cos\(/g, 'Math.cos(')
                    .replace(/tan\(/g, 'Math.tan(')
                    .replace(/√\(/g, 'Math.sqrt(')
                    .replace(/²/g, '**2')
                    .replace(/\^/g, '**')
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/');

                // Handle percentages
                parseable = parseable.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');

                // Auto-close brackets
                const openCount = (parseable.match(/\(/g) || []).length;
                const closeCount = (parseable.match(/\)/g) || []).length;
                for (let i = 0; i < openCount - closeCount; i++) {
                    parseable += ')';
                    expression += ')'; // Show closed brackets in history
                }

                let result = eval(parseable);
                
                // Fix floating point errors (e.g. 0.1 + 0.2 = 0.30000000000000004)
                if (!isNaN(result) && result !== Infinity && result !== -Infinity) {
                    result = Math.round(result * 1e12) / 1e12; 
                }

                lastAnswer = result;
                justEvaluated = true;
                updateDisplay();

            } catch (error) {
                justEvaluated = true;
                lastAnswer = 'Error';
                updateDisplay();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                handleInput(e.key);
            } else if (e.key === '.') {
                handleInput('.');
            } else if (e.key === '+' || e.key === '-') {
                handleInput(e.key);
            } else if (e.key === '*') {
                handleInput('×');
            } else if (e.key === '/') {
                handleInput('÷');
            } else if (e.key === '(') {
                handleInput('(');
            } else if (e.key === ')') {
                handleInput(')');
            } else if (e.key === '^') {
                handleInput('^');
            } else if (e.key === 'Backspace') {
                handleDel();
            } else if (e.key === 'Escape') {
                handleClear();
            } else if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault(); // Prevent accidental form submissions if any
                handleEnter();
            }
        });

        // Initialize state
        updateDisplay();
    </script>
</body>
</html>
